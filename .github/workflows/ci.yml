name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: sh tests/run.sh

  # Some shared hosters still ship SQLite 3.7.17 (2013). A static check
  # (tests/SqliteCompatibilityTest.php) rejects newer SQL syntax in every job;
  # these jobs additionally run the whole suite against real, pinned SQLite
  # libraries: the oldest we support and a current one (WAL side files of the
  # snapshot only showed up with a modern SQLite).
  sqlite:
    name: PHP ${{ matrix.php }} + SQLite ${{ matrix.sqlite.version }}
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        sqlite:
          - { version: '3.7.17', year: '2013', file: '3071700', sha256: '8ff46d0baa9e64c0815544e829e985f1161c096aa6344c8f430791dbeadc2baf' }
          - { version: '3.51.0', year: '2025', file: '3510000', sha256: '42e26dfdd96aa2e6b1b1be5c88b0887f9959093f650d693cb02eb9c36d146ca5' }
    steps:
      - uses: actions/checkout@v4

      - name: Build SQLite ${{ matrix.sqlite.version }}
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gcc libc6-dev curl ca-certificates git unzip > /dev/null
          curl -fsSL -o /tmp/sqlite.tar.gz https://www.sqlite.org/${{ matrix.sqlite.year }}/sqlite-autoconf-${{ matrix.sqlite.file }}.tar.gz
          echo "${{ matrix.sqlite.sha256 }}  /tmp/sqlite.tar.gz" | sha256sum -c -
          mkdir -p /tmp/sqlite /opt/sqlite
          tar xzf /tmp/sqlite.tar.gz -C /tmp/sqlite --strip-components=1
          gcc -shared -fPIC -O2 -w -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_THREADSAFE=1 \
            /tmp/sqlite/sqlite3.c -o /opt/sqlite/libsqlite3.so.0 -lpthread -ldl

      - name: Install dev dependencies (Kirby as fixture)
        run: |
          curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests against SQLite ${{ matrix.sqlite.version }}
        env:
          LD_LIBRARY_PATH: /opt/sqlite
          EXPECTED: ${{ matrix.sqlite.version }}
        run: |
          php -r 'exit(SQLite3::version()["versionString"] === getenv("EXPECTED") ? 0 : 1);' \
            || { echo "::error::PHP does not use SQLite $EXPECTED"; exit 1; }
          # The read-only database check needs a non-root user (root ignores chmod).
          # A copy in /tmp: the runner's workspace path is not traversable for
          # other users, so `su` would not find tests/run.sh there.
          useradd -m tester
          cp -a . /tmp/kizami
          chown -R tester /tmp/kizami
          su tester -c "cd /tmp/kizami && LD_LIBRARY_PATH=$LD_LIBRARY_PATH sh tests/run.sh"
